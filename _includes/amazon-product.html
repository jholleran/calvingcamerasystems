<!-- Amazon Product Card Component -->
<div class="amazon-product col-lg-2 col-md-3 col-sm-4 col-xs-6" style="margin-bottom: 20px; display: flex; align-items: stretch;">
  <div style="border: 1px solid #e5e5e5; border-radius: 4px; padding: 15px; text-align: center; width: 100%; display: flex; flex-direction: column; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); min-height: 280px;">
    <a href="{{ include.link }}?tag=calvingcamera-21" target="_blank" rel="nofollow" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%;">
      {% if include.image %}
      <div style="height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
        <img src="{{ include.image | prepend: site.baseurl }}" alt="{{ include.title }}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
      </div>
      {% endif %}
      <h5 style="font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; margin: 8px 0 6px 0; color: #404040; line-height: 1.2; height: 32px; overflow: hidden;">{{ include.title }}</h5>
      {% if include.description %}
      <p style="font-family: 'Lora', 'Times New Roman', serif; font-size: 11px; color: #808080; margin: 6px 0; line-height: 1.3; flex: 1; overflow: hidden; text-overflow: ellipsis;">{{ include.description }}</p>
      {% endif %}
      <div style="margin-top: auto; padding-top: 10px;">
        <span style="background-color: #0085a1; color: white; padding: 6px 12px; border-radius: 3px; font-family: 'Open Sans', sans-serif; font-size: 11px; font-weight: 600; display: inline-block; transition: background-color 0.3s;">
          View on Amazon
        </span>
      </div>
    </a>
  </div>
</div>
